name: docker-images

on:
  workflow_dispatch:
  push:
    branches:
      - test
      - codex/2.1.20-test
      - latest
    paths:
      - version
      - fn_version
      - src/**
      - public/**
      - assets/**
      - package.json
      - package-lock.json
      - postcss.config.js
      - tailwind.config.js
      - vite.config.js
      - scripts/**
      - web-mobile/**
      - internal/**
      - dockercopilot.go
      - go.mod
      - go.sum
      - etc/**
      - docker/**
      - start.sh
      - .github/workflows/docker-build-test.yml

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-mobile/package-lock.json

      - name: Install root frontend dependencies
        run: npm ci

      - name: Install mobile frontend dependencies
        run: npm --prefix ./web-mobile ci

      - name: Build PC and mobile frontend
        run: npm run build:front

      - name: Verify frontend outputs
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          find front -maxdepth 3 -type f | sort

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-artifacts-${{ github.run_id }}
          path: |
            front/pc
            front/mobile

  build-backend:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-artifacts-${{ github.run_id }}
          path: front-download

      - name: Normalize frontend artifact paths
        run: |
          rm -rf front
          mkdir -p front
          if [ -d front-download/front/pc ] && [ -d front-download/front/mobile ]; then
            mv front-download/front/pc front/pc
            mv front-download/front/mobile front/mobile
          elif [ -d front-download/pc ] && [ -d front-download/mobile ]; then
            mv front-download/pc front/pc
            mv front-download/mobile front/mobile
          else
            echo "unexpected frontend artifact layout:"
            find front-download -maxdepth 4 | sort
            exit 1
          fi
          test -f front/pc/index.html
          test -f front/mobile/index.html

      - name: Get version from file
        run: echo "VERSION=$(cat version)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: true

      - name: Verify embedded frontend and build backend
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.VERSION }} -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=${BUILD_DATE}" -o docker-context/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare docker context payload
        run: |
          mkdir -p docker-context/etc
          cp -r etc/. docker-context/etc/
          find docker-context -maxdepth 4 -type f | sort

      - name: Upload docker context artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-context-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            docker-context/linux/${{ matrix.arch }}/dockerCopilot
            docker-context/etc

  docker:
    needs: [build-backend]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download docker context artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docker-context-*-${{ github.run_id }}
          merge-multiple: true
          path: release-download

      - name: Normalize docker context
        run: |
          rm -rf release
          mkdir -p release/linux release/etc
          if [ -d release-download/docker-context/linux ] || [ -d release-download/docker-context/etc ]; then
            [ -d release-download/docker-context/linux ] && cp -R release-download/docker-context/linux/. release/linux/
            [ -d release-download/docker-context/etc ] && cp -R release-download/docker-context/etc/. release/etc/
          else
            [ -d release-download/linux ] && cp -R release-download/linux/. release/linux/
            [ -d release-download/etc ] && cp -R release-download/etc/. release/etc/
          fi
          test -f release/linux/amd64/dockerCopilot
          test -f release/linux/arm64/dockerCopilot
          test -f release/etc/dockerCopilot.yaml
          find release -maxdepth 4 -type f | sort

      - name: Prepare Docker image tags
        id: image_tags
        run: |
          version="$(cat version)"
          if [ "${GITHUB_REF_NAME}" = "latest" ]; then
            {
              echo "ghcr<<EOF"
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/dockercopilot:latest"
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/dockercopilot:v${version}"
              echo "EOF"
              echo "dockerhub<<EOF"
              echo "${DOCKERHUB_USERNAME}/dockercopilot:latest"
              echo "${DOCKERHUB_USERNAME}/dockercopilot:v${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER}/dockercopilot:test"
              echo "dockerhub=${DOCKERHUB_USERNAME}/dockercopilot:test"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_tags.outputs.ghcr }}
          push: true

      - name: Check DockerHub secrets
        id: dockerhub
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DockerHub secrets are not configured; skipping DockerHub push."
          fi

      - name: Docker Login to DockerHub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push DockerHub image
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_tags.outputs.dockerhub }}
          push: true
