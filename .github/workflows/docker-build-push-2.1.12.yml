name: docker-images-2.1.12

on:
  workflow_dispatch:
  push:
    branches:
      - 2.1.12
    paths:
      - version
      - fn_version
      - src/**
      - public/**
      - assets/**
      - package.json
      - package-lock.json
      - postcss.config.js
      - tailwind.config.js
      - vite.config.js
      - scripts/**
      - web-mobile/**
      - internal/**
      - dockercopilot.go
      - go.mod
      - go.sum
      - etc/**
      - docker/**
      - start.sh
      - .github/workflows/docker-build-push-2.1.12.yml

concurrency:
  group: docker-images-2.1.12-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-mobile/package-lock.json

      - name: Install root frontend dependencies
        run: npm ci

      - name: Install mobile frontend dependencies
        run: npm --prefix ./web-mobile ci

      - name: Build PC and mobile frontend
        run: npm run build:front

      - name: Verify frontend outputs
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          echo "frontend outputs ready:"
          find front -maxdepth 3 -type f | sort

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-artifacts-2.1.12
          path: |
            front/pc
            front/mobile

  build-backend:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-artifacts-2.1.12
          path: front-download

      - name: Normalize frontend artifact paths
        run: |
          rm -rf front
          mkdir -p front
          if [ -d front-download/front/pc ] && [ -d front-download/front/mobile ]; then
            mv front-download/front/pc front/pc
            mv front-download/front/mobile front/mobile
          elif [ -d front-download/pc ] && [ -d front-download/mobile ]; then
            mv front-download/pc front/pc
            mv front-download/mobile front/mobile
          else
            echo "unexpected frontend artifact layout:"
            find front-download -maxdepth 4 | sort
            exit 1
          fi
          test -f front/pc/index.html
          test -f front/mobile/index.html
          echo "normalized frontend layout:"
          find front -maxdepth 3 -type f | sort

      - name: Get version from file
        run: |
          echo "VERSION=$(cat version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: true

      - name: Verify embedded frontend and build backend
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.VERSION }} -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=${BUILD_DATE}" -o release/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare docker context payload
        run: |
          mkdir -p docker-context/linux/${{ matrix.arch }}
          mkdir -p docker-context/etc
          cp release/linux/${{ matrix.arch }}/dockerCopilot docker-context/linux/${{ matrix.arch }}/dockerCopilot
          cp -r etc/. docker-context/etc/
          echo "docker-context prepared:"
          find docker-context -maxdepth 4 -type f | sort

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-context-${{ matrix.arch }}-2.1.12
          path: |
            docker-context/linux/${{ matrix.arch }}/dockerCopilot
            docker-context/etc

  docker-ghcr:
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from file
        run: |
          echo "VERSION=$(cat version)" >> $GITHUB_ENV

      - name: Download docker context artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docker-context-*-2.1.12
          merge-multiple: true
          path: release-download

      - name: Normalize docker context
        run: |
          rm -rf release
          mkdir -p release/linux
          if [ -d release-download/docker-context/linux ] || [ -d release-download/docker-context/etc ]; then
            mv release-download/docker-context/linux release/linux || true
            mv release-download/docker-context/etc release/etc || true
          else
            mv release-download/linux release/linux || true
            mv release-download/etc release/etc || true
          fi
          test -f release/linux/amd64/dockerCopilot
          test -f release/linux/arm64/dockerCopilot
          test -f release/etc/dockerCopilot.yaml
          echo "release payload ready:"
          find release -maxdepth 4 -type f | sort

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dockercopilot:v${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/dockercopilot:2.1.12
          push: true

  docker-dockerhub:
    runs-on: ubuntu-latest
    needs: [build-backend]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check DockerHub secrets
        id: dockerhub
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DockerHub secrets are not configured; skipping DockerHub push."
          fi

      - name: Checkout code
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Get version from file
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          echo "VERSION=$(cat version)" >> $GITHUB_ENV

      - name: Download docker context artifacts
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: docker-context-*-2.1.12
          merge-multiple: true
          path: release-download

      - name: Normalize docker context
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          rm -rf release
          mkdir -p release/linux
          if [ -d release-download/docker-context/linux ] || [ -d release-download/docker-context/etc ]; then
            mv release-download/docker-context/linux release/linux || true
            mv release-download/docker-context/etc release/etc || true
          else
            mv release-download/linux release/linux || true
            mv release-download/etc release/etc || true
          fi
          test -f release/linux/amd64/dockerCopilot
          test -f release/linux/arm64/dockerCopilot
          test -f release/etc/dockerCopilot.yaml
          echo "release payload ready:"
          find release -maxdepth 4 -type f | sort

      - name: Docker Setup Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to DockerHub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push DockerHub images
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:v${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:2.1.12
          push: true
