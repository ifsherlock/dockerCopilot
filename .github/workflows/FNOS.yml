name: FNOS

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - fn_version
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - internal/**
      - dockercopilot.go
      - go.mod
      - go.sum
      - etc/**
      - .github/workflows/FNOS.yml

concurrency:
  group: fnos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            package.json

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-front-dist
          path: dist

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v4

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-front-*
          merge-multiple: true
          path: front

      - run: ls -R front

      - name: Get FNOS version from file
        id: get_version
        run: |
          fn_version=$(cat fn_version)
          release_version=$(printf '%s' "$fn_version" | sed 's/^v//' | sed 's/-FNOS$//')
          echo "fn_version=$fn_version" >> $GITHUB_ENV
          echo "release_version=$release_version" >> $GITHUB_ENV

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/msaber-back/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: true

      - name: Build for ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.fn_version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" -o dist/linux/${{ matrix.arch }}/dockerCopilot-new .

      - name: Compress binary
        run: |
          tar -czvf dockerCopilot-fnos-${{ matrix.arch }}.tar.gz dist/linux/${{ matrix.arch }}/dockerCopilot-new

      - name: List current directory
        run: ls -la

      - name: Check if base release already exists
        id: check_release
        run: |
          exists=$(gh release view ${{ env.release_version }} 2>&1 | grep "release not found" || true)
          if [[ -z "$exists" ]]; then
            echo "Release exists"
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Release does not exist"
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create base GitHub Release if not exists
        if: env.RELEASE_EXISTS == 'false'
        run: |
          gh release create ${{ env.release_version }} \
            --title "${{ env.release_version }}" \
            --notes "Release of version ${{ env.release_version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload FNOS asset for ${{ matrix.arch }} to base release
        run: |
          gh release upload ${{ env.release_version }} dockerCopilot-fnos-${{ matrix.arch }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
