name: dockercopilot-bot

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - 'bot/**'
      - '.github/workflows/dockercopilot-bot.yml'

concurrency:
  group: dockercopilot-bot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-bot-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from file
        run: echo "version=$(cat version)" >> "$GITHUB_ENV"

      - name: Build and push bot image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          file: ./bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dockercopilot-bot:${{ env.version }}
            ghcr.io/${{ github.repository_owner }}/dockercopilot-bot:latest
          push: true

  docker-bot-dockerhub:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check DockerHub secrets
        id: dockerhub
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DockerHub secrets are not configured; skipping DockerHub bot push."
          fi

      - name: Checkout code
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Docker Setup QEMU
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to DockerHub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from file
        if: steps.dockerhub.outputs.enabled == 'true'
        run: echo "version=$(cat version)" >> "$GITHUB_ENV"

      - name: Build and push bot image to DockerHub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          file: ./bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot-bot:${{ env.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot-bot:latest
          push: true
