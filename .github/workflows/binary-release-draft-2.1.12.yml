name: binary-release-draft-2.1.12

on:
  workflow_dispatch:
  push:
    branches:
      - 2.1.12
    paths:
      - version
      - fn_version
      - src/**
      - public/**
      - assets/**
      - package.json
      - package-lock.json
      - postcss.config.js
      - tailwind.config.js
      - vite.config.js
      - scripts/**
      - web-mobile/**
      - internal/**
      - dockercopilot.go
      - go.mod
      - go.sum
      - .github/workflows/binary-release-draft-2.1.12.yml

concurrency:
  group: binary-release-draft-2.1.12-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-mobile/package-lock.json

      - name: Install root frontend dependencies
        run: npm ci

      - name: Install mobile frontend dependencies
        run: npm --prefix ./web-mobile ci

      - name: Build PC and mobile frontend
        run: npm run build:front

      - name: Verify frontend outputs
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          echo "frontend outputs ready:"
          find front -maxdepth 3 -type f | sort

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-artifacts-2.1.12
          path: |
            front/pc
            front/mobile

  build-binaries:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-artifacts-2.1.12
          path: front-download

      - name: Normalize frontend artifact paths
        run: |
          rm -rf front
          mkdir -p front
          if [ -d front-download/front/pc ] && [ -d front-download/front/mobile ]; then
            mv front-download/front/pc front/pc
            mv front-download/front/mobile front/mobile
          elif [ -d front-download/pc ] && [ -d front-download/mobile ]; then
            mv front-download/pc front/pc
            mv front-download/mobile front/mobile
          else
            echo "unexpected frontend artifact layout:"
            find front-download -maxdepth 4 | sort
            exit 1
          fi
          test -f front/pc/index.html
          test -f front/mobile/index.html
          echo "normalized frontend layout:"
          find front -maxdepth 3 -type f | sort

      - name: Get version from file
        run: |
          echo "VERSION=$(cat version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: true

      - name: Build linux binary for ${{ matrix.arch }}
        run: |
          mkdir -p release/linux/${{ matrix.arch }}
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.VERSION }} -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=${BUILD_DATE}" -o release/linux/${{ matrix.arch }}/dockerCopilot .
          test -f release/linux/${{ matrix.arch }}/dockerCopilot

      - name: Package binary artifact
        run: |
          tar -czf dockerCopilot-linux-${{ matrix.arch }}.tar.gz -C release/linux/${{ matrix.arch }} dockerCopilot
          test -f dockerCopilot-linux-${{ matrix.arch }}.tar.gz
          ls -lh dockerCopilot-linux-${{ matrix.arch }}.tar.gz

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: binary-artifacts-${{ matrix.arch }}-2.1.12
          path: dockerCopilot-linux-${{ matrix.arch }}.tar.gz

  publish-draft-release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from file
        run: |
          echo "VERSION=$(cat version)" >> $GITHUB_ENV

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-artifacts-*-2.1.12
          merge-multiple: true
          path: release-assets

      - name: Verify packaged binaries
        run: |
          test -f release-assets/dockerCopilot-linux-amd64.tar.gz
          test -f release-assets/dockerCopilot-linux-arm64.tar.gz
          echo "release assets ready:"
          find release-assets -maxdepth 2 -type f | sort

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.VERSION }}
          body: Draft release of version ${{ env.VERSION }}
          draft: true
          prerelease: false
          files: |
            release-assets/dockerCopilot-linux-amd64.tar.gz
            release-assets/dockerCopilot-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
