name: latest

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - version
      - fn_version
      - src/**
      - public/**
      - assets/**
      - package.json
      - package-lock.json
      - postcss.config.js
      - tailwind.config.js
      - vite.config.js
      - scripts/**
      - web-mobile/**
      - internal/**
      - dockercopilot.go
      - go.mod
      - go.sum
      - etc/**
      - docker/**
      - start.sh
      - .github/workflows/latest.yml

concurrency:
  group: latest-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-mobile/package-lock.json

      - name: Install root frontend dependencies
        run: npm ci

      - name: Install mobile frontend dependencies
        run: npm --prefix ./web-mobile ci

      - name: Build PC and mobile frontend
        run: npm run build:front

      - name: Verify frontend outputs
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          echo "frontend outputs ready:"
          find front -maxdepth 3 -type f | sort

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-artifacts
          path: |
            front/pc
            front/mobile

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-artifacts
          path: front-download

      - name: Normalize frontend artifact paths
        run: |
          rm -rf front
          mkdir -p front
          if [ -d front-download/front/pc ] && [ -d front-download/front/mobile ]; then
            mv front-download/front/pc front/pc
            mv front-download/front/mobile front/mobile
          elif [ -d front-download/pc ] && [ -d front-download/mobile ]; then
            mv front-download/pc front/pc
            mv front-download/mobile front/mobile
          else
            echo "unexpected frontend artifact layout:"
            find front-download -maxdepth 4 | sort
            exit 1
          fi
          test -f front/pc/index.html
          test -f front/mobile/index.html
          echo "normalized frontend layout:"
          find front -maxdepth 3 -type f | sort

      - name: Get version from file
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: true

      - name: Build for ${{ matrix.arch }}
        run: |
          test -f front/pc/index.html
          test -f front/mobile/index.html
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }} -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=${BUILD_DATE}" -o dist/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Compress binary
        run: |
          tar -czvf dockerCopilot-${{ matrix.arch }}.tar.gz dist/linux/${{ matrix.arch }}/dockerCopilot

      - name: List current directory
        run: ls -la

      - name: Check if release already exists
        id: check_release
        run: |
          exists=$(gh release view ${{ env.version }} 2>&1 | grep "release not found" || true)
          if [[ -z "$exists" ]]; then
            echo "Release exists"
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Release does not exist"
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release if not exists
        if: env.RELEASE_EXISTS == 'false'
        run: |
          gh release create ${{ env.version }} \
            --title "${{ env.version }}" \
            --notes "Release of version ${{ env.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release is published
        run: |
          gh release edit ${{ env.version }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Asset for ${{ matrix.arch }}
        run: |
          gh release upload ${{ env.version }} dockerCopilot-${{ matrix.arch }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
